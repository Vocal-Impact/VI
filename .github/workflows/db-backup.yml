name: Weekly database backup

# Encrypted pg_dump of production, kept 90 days as a workflow artifact.
# Needs repository secrets:
#   BACKUP_DATABASE_URL  – Neon *direct* connection string (read-only role recommended)
#   BACKUP_PASSPHRASE    – long random passphrase, also stored with the committee's handover notes
# Restore: gpg --decrypt backup.sql.gz.gpg | gunzip | psql "$DATABASE_URL"

on:
  schedule:
    - cron: "0 20 * * 0" # Sunday 20:00 UTC = Monday 01:30 Sri Lanka
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets are configured
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL is not set — skipping backup."; exit 0
          fi
          echo "configured=true" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        if: env.configured == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        if: env.configured == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-privileges | gzip > backup.sql.gz
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" backup.sql.gz
          rm backup.sql.gz

      - name: Upload encrypted backup
        if: env.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.sql.gz.gpg
          retention-days: 90
